<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Arnav Gowda | Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="umd.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="paper" class="resume-page">
  <div class="page-noise" aria-hidden="true"></div>
  <div class="page-lines" aria-hidden="true"></div>

  <header class="site-header">
    <div class="masthead">
      <a href="index.html" class="brand">
        <span class="brand-kicker">Resume Edition</span>
        <span class="brand-name">Arnav Gowda</span>
      </a>
      <nav class="site-nav" id="siteNav" aria-label="Primary">
        <a href="index.html#research">Research</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#experience">Experience</a>
        <a href="index.html#analytics">Field Notes</a>
        <a href="index.html#skills">Stack</a>
      </nav>
      <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">
          Night Edition
        </button>
        <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteNav">
          Menu
        </button>
      </div>
    </div>
  </header>

  <main class="resume-shell reveal">
    <section class="section-shell">
      <div class="section-heading">
        <p class="eyebrow">Document</p>
        <h1>Resume</h1>
        <p class="lede">Same visual language, stripped to the essential artifact.</p>
      </div>
      <div class="resume-actions">
        <a class="button button-solid" href="resume.pdf" download>Download PDF</a>
        <a class="button button-outline" href="index.html">Back to portfolio</a>
      </div>
      <div class="resume-frame">
        <iframe src="resume.pdf" title="Arnav Gowda resume"></iframe>
      </div>
    </section>
  </main>

  <script src="site.js"></script>

</html>
